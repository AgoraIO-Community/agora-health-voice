title = "Health Voice secret protection"

[extend]
useDefault = true

# Also catch provider credentials/passwords without a vendor-specific prefix.
[[rules]]
id = "health-voice-credential"
description = "Literal credential assignment"
regex = '''(?i)(?:[a-z0-9_]*(?:password|passwd|pwd|secret|api_key|apikey|app_certificate|access_token|auth_token|private_key|client_token)[a-z0-9_]*)[ \t]*[=:][ \t]*["']?([a-z0-9_+/.=:@-]{8,})'''
secretGroup = 1

[[rules.allowlists]]
regexTarget = "secret"
# Code expressions, not literal credentials. No file or directory exclusions.
regexes = ['''^config\.murfKey$''', '''^(?:process\.)?env\.[A-Z_][A-Z0-9_]*$''']

[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)tests/recipe\.test\.mjs$''']
regexTarget = "secret"
regexes = ['''^test-(?:secret|murf)$''']
